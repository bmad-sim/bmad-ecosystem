name: Bmad Ecosystem - Build & Test

permissions:
  contents: read

on:
  # Run on demand, push, or pull request
  workflow_dispatch:
  push:
  pull_request:

  ## Future Ideas:
  ## PR make it 10 or less
  ## For main and time based we can run something bigger

  ## Run when releases are published
  ## release:
  ##   types:
  ##     - "published"

# Configuration for the version of external packages
# We do this so we can cache them and avoid checking out that big
# repository at all times.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXTERNAL_PACKAGES_VERSION: main

#
jobs:
  build:
    runs-on: ${{ matrix.os }}
    #
    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        # Future Ideas:
        # add macOS - check if GH Actions can make intel and arm
        os: [ubuntu-latest]
        shared: ["Y"]
        openmp_mpi: ["N", "Y"]
        plot_package: ["pgplot"]
        include:
          # quick_plot Cairo backend (no PLplot, PGPLOT or X11).
          - os: ubuntu-latest
            shared: "Y"
            openmp_mpi: "N"
            plot_package: "cairo"

    steps:
      # Check out the code from GitHub
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-dependencies
        with:
          external-packages-version: ${{ env.EXTERNAL_PACKAGES_VERSION }}

      - name: Install Cairo backend dependencies
        if: ${{ matrix.plot_package == 'cairo' }}
        run: sudo apt-get install -y libgtk-3-dev xvfb poppler-utils

      - name: Build Bmad
        env:
          USE_MPI: ${{ matrix.openmp_mpi }}
          SHARED: ${{ matrix.shared }}
          PLOT_PACKAGE: ${{ matrix.plot_package }}
        run: .github/scripts/install_bmad.sh

      - name: Run Tests
        shell: bash -eo pipefail -l {0}
        run: .github/scripts/run_tests.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check Cairo plotting
        if: ${{ matrix.plot_package == 'cairo' }}
        shell: bash -eo pipefail -l {0}
        run: .github/scripts/test_cairo_plot.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
